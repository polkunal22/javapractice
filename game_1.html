<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .game {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(12px);
      padding: 35px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .score-card .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }

    .score-card .value {
      font-size: 30px;
      font-weight: 700;
      margin-top: 2px;
    }

    .score-card.you .value { color: #38bdf8; }
    .score-card.cpu .value { color: #fb7185; }

    /* Arena */
    .arena {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 130px;
    }

    .hand {
      font-size: 60px;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(148, 163, 184, 0.08);
      border-radius: 50%;
      user-select: none;
    }

    .hand.cpu-hand { transform: scaleX(-1); }

    .hand.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-12px) rotate(-8deg); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-12px) rotate(8deg); }
    }

    .hand.cpu-hand.shake { animation-name: shake-flip; }

    @keyframes shake-flip {
      0%, 100% { transform: scaleX(-1) translateY(0); }
      25% { transform: scaleX(-1) translateY(-12px) rotate(8deg); }
      50% { transform: scaleX(-1) translateY(0); }
      75% { transform: scaleX(-1) translateY(-12px) rotate(-8deg); }
    }

    .vs {
      font-size: 18px;
      font-weight: 700;
      color: #475569;
    }

    .hand-name {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .hand-wrap { text-align: center; }

    /* Result */
    #result {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      min-height: 32px;
      margin-bottom: 22px;
      transition: color 0.2s;
    }

    #result.win  { color: #4ade80; }
    #result.lose { color: #fb7185; }
    #result.draw { color: #facc15; }

    /* Buttons */
    .choices {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .choices button {
      flex: 1;
      max-width: 130px;
      padding: 14px 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    .choices button .emoji {
      display: block;
      font-size: 28px;
      margin-bottom: 4px;
    }

    .choices button:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      transform: translateY(-3px);
    }

    .choices button:active {
      transform: translateY(0);
    }

    .choices button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .reset-btn {
      display: block;
      margin: 0 auto;
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      color: #0f172a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .reset-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="game">
    <h1>Stone Paper Scissors</h1>
    <p class="subtitle">Choose your move and beat the computer!</p>

    <div class="scoreboard">
      <div class="score-card you">
        <div class="label">You</div>
        <div class="value" id="userScore">0</div>
      </div>
      <div class="score-card cpu">
        <div class="label">Computer</div>
        <div class="value" id="computerScore">0</div>
      </div>
    </div>

    <div class="arena">
      <div class="hand-wrap">
        <div class="hand" id="userHand">✊</div>
        <div class="hand-name" id="userHandName">You</div>
      </div>
      <div class="vs">VS</div>
      <div class="hand-wrap">
        <div class="hand cpu-hand" id="computerHand">✊</div>
        <div class="hand-name" id="computerHandName">Computer</div>
      </div>
    </div>

    <div id="result">Make your move!</div>

    <div class="choices">
      <button onclick="playGame('stone')"><span class="emoji">✊</span>Stone</button>
      <button onclick="playGame('paper')"><span class="emoji">✋</span>Paper</button>
      <button onclick="playGame('scissors')"><span class="emoji">✌️</span>Scissors</button>
    </div>

    <button class="reset-btn" onclick="resetGame()">Reset Game</button>
  </div>

  <script>
    const choices = ["stone", "paper", "scissors"];
    const emojis  = { stone: "✊", paper: "✋", scissors: "✌️" };
    const names   = { stone: "Stone", paper: "Paper", scissors: "Scissors" };

    let userScore = 0;
    let computerScore = 0;

    function playGame(userChoice) {
      const computerChoice = choices[Math.floor(Math.random() * 3)];

      const userHand = document.getElementById("userHand");
      const cpuHand = document.getElementById("computerHand");

      // Reset hands and replay shake animation
      userHand.classList.remove("shake");
      cpuHand.classList.remove("shake");
      void userHand.offsetWidth;
      void cpuHand.offsetWidth;
      userHand.classList.add("shake");
      cpuHand.classList.add("shake");

      userHand.textContent = emojis[userChoice];
      cpuHand.textContent = emojis[computerChoice];
      document.getElementById("userHandName").innerText = "You: " + names[userChoice];
      document.getElementById("computerHandName").innerText = "Computer: " + names[computerChoice];

      const resultEl = document.getElementById("result");
      let result = "";
      let type = "";

      if (userChoice === computerChoice) {
        result = "It's a Draw!";
        type = "draw";
      } else if (
        (userChoice === "stone" && computerChoice === "scissors") ||
        (userChoice === "paper" && computerChoice === "stone") ||
        (userChoice === "scissors" && computerChoice === "paper")
      ) {
        result = "🎉 You Win!";
        type = "win";
        userScore++;
      } else {
        result = "Computer Wins! 🤖";
        type = "lose";
        computerScore++;
      }

      resultEl.innerText = result;
      resultEl.className = type;

      document.getElementById("userScore").innerText = userScore;
      document.getElementById("computerScore").innerText = computerScore;
    }

    function resetGame() {
      userScore = 0;
      computerScore = 0;

      document.getElementById("userScore").innerText = 0;
      document.getElementById("computerScore").innerText = 0;

      document.getElementById("userHand").textContent = "✊";
      document.getElementById("computerHand").textContent = "✊";
      document.getElementById("userHandName").innerText = "You";
      document.getElementById("computerHandName").innerText = "Computer";

      const resultEl = document.getElementById("result");
      resultEl.innerText = "Make your move!";
      resultEl.className = "";
    }
  </script>
</body>
</html>
