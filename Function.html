<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //function --> A function is a reusable block of code it is used to perform a specific task.

        //declare and define
        function greet(){
            console.log("welcome to javascript");

            for(let i=1;i<=1000;i++){
                console.log("hello kunal",i);
            }
        };

        /*
        syntax:

        function functionName(){
        //block of code
        }


        */

        //call

        greet();
        greet();
        greet();
    </script>
    
</body>
</html>
