<div id="slider">
    <img src="1.jpg" alt="Slide 1">
    <img src="2.jpg" alt="Slide 2">
    <img src="3.jpg" alt="Slide 3">
</div>
<button id="prev">Prev</button> <button id="next">Next</button>
<style> #slider img { display: none; width: 300px; } </style>
<script>
var i = 0, n = $("#slider img").length;
$("#slider img").eq(0).show();
function go(k){
$("#slider img").eq(i).fadeOut(300);
i = (k + n) % n;                       
// wrap around
$("#slider img").eq(i).fadeIn(300);
}
$("#next").click(function(){ go(i + 1); });
$("#prev").click(function(){ go(i - 1); });
setInterval(function(){ go(i + 1); }, 3000);
</script>







<input id="a" type="number"> <input id="b" type="number">
<button class="op" data-op="+">+</button>
<button class="op" data-op="-">-</button>
<button class="op" data-op="*">×</button>
<button class="op" data-op="/">÷</button>
<p>Result: <span id="res">0</span></p>


<style> input { padding: 8px; width: 200px; } </style>
<input type="password" id="pwd" placeholder="Password">
<label><input type="checkbox" id="show "> Show</label>


<script>
    document.querySelectorAll(".op").forEach(function (button) {
        button.addEventListener("click", function () {
            const a = parseFloat(document.getElementById("a").value);
            const b = parseFloat(document.getElementById("b").value);
            const op = button.dataset.op;
            let result;

            if (Number.isNaN(a) || Number.isNaN(b)) {
                result = "Enter both numbers";
            } else if (op === "+") {
                result = a + b;
            } else if (op === "-") {
                result = a - b;
            } else if (op === "*") {
                result = a * b;
            } else {
                result = b === 0 ? "Cannot divide by 0" : a / b;
            }

            document.getElementById("res").textContent = result;
        });
    });


    $("#show ").change(function(){
var type = this.checked ? "text" : "password";
$("#pwd").attr("type", type);
});
</script>
