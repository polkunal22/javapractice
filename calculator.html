<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #756d6d;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 340px;
    padding: 25px;
    background: #756060;
    border-radius: 20px;
    box-shadow: 0 10px 30px #000;
}

h2 {
    color: rgb(114, 7, 133);
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
}

#display {
    width: 100%;
    height: 75px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    background: #a33a3a;
    color: white;
    font-size: 30px;
    text-align: right;
    padding: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #444;
    color: rgb(214, 208, 208);
    font-size: 21px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #825656;
    transform: scale(1.04);
}

.operator {
    background: #4a4e01;
}

.operator:hover {
    background: #9fa411;
}

.equal {
    background: #00a86b;
}

.equal:hover {
    background: #00c982;
}
</style>
<body>

    <div class="calculator">

        <h2>CALCULATOR</h2>

        <input type="text" id="display"
               placeholder="0" readonly>

        <div class="buttons">

            <button class="operator" data-action="clear">AC</button>
            <button class="operator" data-action="delete">DEL</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-action="sign">+/-</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="calculate">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");
const buttons = document.querySelector(".buttons");

buttons.addEventListener("click", function(event) {

    const button = event.target;

    if (button.tagName !== "BUTTON") return;

    const value = button.dataset.value;
    const action = button.dataset.action;

    // Clear
    if (action === "clear") {
        display.value = "";
        return;
    }

    // Delete
    if (action === "delete") {
        display.value = display.value.slice(0, -1);
        return;
    }

    // Percentage
    if (action === "percent") {
        if (display.value !== "") {
            display.value = String(
                Number(display.value) / 100
            );
        }
        return;
    }

    // Positive / Negative
    if (action === "sign") {
        if (display.value !== "") {
            display.value = String(
                Number(display.value) * -1
            );
        }
        return;
    }

    // Calculate
    if (action === "calculate") {
        try {
            const expression = display.value;

            if (!/^[0-9+\-*/.()\s]+$/.test(expression)) {
                throw new Error("Invalid Expression");
            }

            const result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!Number.isFinite(result)) {
                throw new Error("Math Error");
            }

            display.value = String(
                Number(result.toFixed(10))
            );

        } catch (error) {
            display.value = "Error";
        }

        return;
    }

    // Number and operator input
    if (value !== undefined) {
        if (display.value === "Error") {
            display.value = "";
        }

        display.value += value;
    }
});


    </script>
</body>
</html>
