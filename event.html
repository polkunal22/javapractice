<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="hov">hover over me</div>
    <button id="btn">click me</button>


    <script>
        const button=document.getElementById("btn");
        button.addEventListener("click",function(){
            alert("Button clicked!");
        });


        const hov=document.getElementById("hov");
        hov.addEventListener("mouseover",function(){
            hov.style.backgroundColor="yellow";
        });
        hov.addEventListener("mouseout",function(){
            hov.style.backgroundColor="white";
        });
        hov.addEventListener("click",function(){
            hov.style.backgroundColor="green";
        });
        hov.addEventListener("dblclick",function(){
            hov.style.backgroundColor="red";
        });
        hov.addEventListener("contextmenu",function(event){
            event.preventDefault();
            hov.style.backgroundColor="blue";
        });
        hov.addEventListener("mousedown",function(){
            hov.style.backgroundColor="orange";
        });
        hov.addEventListener("mouseup",function(){
            hov.style.backgroundColor="purple";
        });
    </script>
</body>
</html>
